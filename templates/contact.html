<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ConnectHub</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Join Our Community</h1>
        <p class="form-intro">Fill out the form below to become part of our growing network of professionals and enthusiasts.</p>
        <form action="/contact" method="post">
            <label for="name">Your Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Professional Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <button type="submit" class="btn">Join Now</button>
        </form>
    </div>
    <div class="footer">ConnectHub &copy; 2024 - Building Bridges, One Connection at a Time</div>
</body>
</html>
